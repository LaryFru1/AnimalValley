<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Valley — Editar pet</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="screen">
    <div class="back-row">
      <button class="back-btn" id="btn-voltar">←</button>
      <div>
        <div class="step-title">Editar pet</div>
        <div class="step-hint">Corrija ou complete as informações</div>
      </div>
    </div>

    <form id="pet-form" class="body">
      <div class="photo-upload-row">
  <label class="photo-circle" for="pet-foto-edit" id="preview-foto" style="background-size:cover;background-position:center"></label>
  <input type="file" id="pet-foto-edit" accept="image/*" style="display:none">
  <div class="photo-hint">Foto de perfil do pet<br><span>Toque para trocar</span></div>
</div>
      <label class="field">Nome do pet</label>
      <input type="text" id="pet-nome" class="field-input" required>

      <label class="field">Espécie</label>
<select id="pet-especie" class="field-input" required>
  <option value="">Selecione</option>
  <option value="cao">Cão</option>
  <option value="gato">Gato</option>
  <option value="outro">Outro</option>
</select>
      
      <div class="field-row">
        <div>
          <label class="field">Raça</label>
          <select id="pet-raca" class="field-input">
  <option value="">Selecione</option>
  <option value="SRD">SRD (Sem Raça Definida)</option>
  <option value="Affenpinscher">Affenpinscher</option>
  <option value="Afghan Hound">Afghan Hound</option>
  <option value="Akita">Akita</option>
  <option value="American Bully">American Bully</option>
  <option value="American Curl">American Curl</option>
  <option value="American Pit Bull">American Pit Bull</option>
  <option value="American Shorthair">American Shorthair</option>
  <option value="American Staffordshire Terrier">American Staffordshire Terrier</option>
  <option value="Angora Turco">Angora Turco</option>
  <option value="Azul Russo">Azul Russo</option>
  <option value="Basenji">Basenji</option>
  <option value="Basset Hound">Basset Hound</option>
  <option value="Beagle">Beagle</option>
  <option value="Bengal">Bengal</option>
  <option value="Bernese">Bernese</option>
  <option value="Bichon Frisé">Bichon Frisé</option>
  <option value="Bichon Maltês">Bichon Maltês</option>
  <option value="Biewer Terrier">Biewer Terrier</option>
  <option value="Boiadeiro Australiano">Boiadeiro Australiano</option>
  <option value="Boiadeiro Bernês">Boiadeiro Bernês</option>
  <option value="Bombaim">Bombaim</option>
  <option value="Border Collie">Border Collie</option>
  <option value="Boston Terrier">Boston Terrier</option>
  <option value="Boxer">Boxer</option>
  <option value="Brazilian Shorthair">Brazilian Shorthair</option>
  <option value="Bright Long Hair">Bright Long Hair</option>
  <option value="Buldogue Francês">Buldogue Francês</option>
  <option value="Bull Terrier">Bull Terrier</option>
  <option value="Bulldog">Bulldog</option>
  <option value="Bulldog Francês">Bulldog Francês</option>
  <option value="Bulldog Inglês">Bulldog Inglês</option>
  <option value="Calopsita">Calopsita</option>
  <option value="Cavalier King Charles Spaniel">Cavalier King Charles Spaniel</option>
  <option value="Chihuahua">Chihuahua</option>
  <option value="Chow Chow">Chow Chow</option>
  <option value="Cocker Spaniel">Cocker Spaniel</option>
  <option value="Cocker Spaniel Americano">Cocker Spaniel Americano</option>
  <option value="Cocker Spaniel Inglês">Cocker Spaniel Inglês</option>
  <option value="Collie Pêlo Curto">Collie Pêlo Curto</option>
  <option value="Coton De Tuléar">Coton De Tuléar</option>
  <option value="Dachshund">Dachshund</option>
  <option value="Dálmata">Dálmata</option>
  <option value="Exótico">Exótico</option>
  <option value="Fox Terrier Pêlo Duro">Fox Terrier Pêlo Duro</option>
  <option value="Fox Terrier Pêlo Liso">Fox Terrier Pêlo Liso</option>
  <option value="Foxhound Americano">Foxhound Americano</option>
  <option value="Galgo Espanhol">Galgo Espanhol</option>
  <option value="Galgo Inglês">Galgo Inglês</option>
  <option value="Galgo Italiano">Galgo Italiano</option>
  <option value="Golden Retriever">Golden Retriever</option>
  <option value="Grande Boiadeiro Suíço">Grande Boiadeiro Suíço</option>
  <option value="Husky Siberiano">Husky Siberiano</option>
  <option value="Italian Greyhound">Italian Greyhound</option>
  <option value="Jack Russell Terrier">Jack Russell Terrier</option>
  <option value="Labrador">Labrador</option>
  <option value="Lhasa Apso">Lhasa Apso</option>
  <option value="Lulu Da Pomerania">Lulu Da Pomerania</option>
  <option value="Maine Coon">Maine Coon</option>
  <option value="Malamute do Alaska">Malamute do Alaska</option>
  <option value="Maltês">Maltês</option>
  <option value="Markiesje">Markiesje</option>
  <option value="Munchkin">Munchkin</option>
  <option value="Papillon">Papillon</option>
  <option value="Pastor Alemão">Pastor Alemão</option>
  <option value="Pastor Australiano">Pastor Australiano</option>
  <option value="Pastor Belga">Pastor Belga</option>
  <option value="Pastor Branco Suíço">Pastor Branco Suíço</option>
  <option value="Pastor de Shetland">Pastor de Shetland</option>
  <option value="Pastor Maremano Abruzês">Pastor Maremano Abruzês</option>
  <option value="Pastora da Mantiqueira">Pastora da Mantiqueira</option>
  <option value="PCB">PCB</option>
  <option value="Pequinês">Pequinês</option>
  <option value="Persa">Persa</option>
  <option value="Pinscher">Pinscher</option>
  <option value="Pinscher Miniatura">Pinscher Miniatura</option>
  <option value="Pit Bull">Pit Bull</option>
  <option value="Pomsky">Pomsky</option>
  <option value="Poodle">Poodle</option>
  <option value="Poodle Standard">Poodle Standard</option>
  <option value="Porquinho da Índia">Porquinho da Índia</option>
  <option value="Pug">Pug</option>
  <option value="Ragdoll">Ragdoll</option>
  <option value="Rottweiler">Rottweiler</option>
  <option value="Samoieda">Samoieda</option>
  <option value="Schnauzer">Schnauzer</option>
  <option value="Scottish Fold">Scottish Fold</option>
  <option value="Selkirk">Selkirk</option>
  <option value="Shar Pei">Shar Pei</option>
  <option value="Shiba">Shiba</option>
  <option value="Shih Tzu">Shih Tzu</option>
  <option value="Siamês">Siamês</option>
  <option value="Spaniel Anão">Spaniel Anão</option>
  <option value="Spaniel Japonês">Spaniel Japonês</option>
  <option value="Sphynx">Sphynx</option>
  <option value="Spitz Alemão">Spitz Alemão</option>
  <option value="Spitz Japonês">Spitz Japonês</option>
  <option value="Springer Spaniel Inglês">Springer Spaniel Inglês</option>
  <option value="Staffordshire Bull Terrier">Staffordshire Bull Terrier</option>
  <option value="Terrier Brasileiro">Terrier Brasileiro</option>
  <option value="Terrier Escocês">Terrier Escocês</option>
  <option value="Vulpino Italiano">Vulpino Italiano</option>
  <option value="Welsh Corgi Cardigan">Welsh Corgi Cardigan</option>
  <option value="West Highland White Terrier">West Highland White Terrier</option>
  <option value="Whippet">Whippet</option>
  <option value="Yorkshire Terrier">Yorkshire Terrier</option>
  <option value="outro">Outro</option>
</select>
<input type="text" id="pet-raca-outro" class="field-input" placeholder="Qual raça?" style="margin-top:8px;display:none">
        </div>
        <div>
          <label class="field">Sexo</label>
          <select id="pet-sexo" class="field-input" required>
            <option value="">Selecione</option>
            <option value="M">Macho</option>
            <option value="F">Fêmea</option>
          </select>
        </div>
      </div>

      <label class="field">Nº do microchip <span class="opt">(se tiver)</span></label>
      <input type="text" id="pet-microchip" class="field-input" placeholder="Ex: 900000000000000">

      <div class="field-row">
        <div>
          <label class="field">Peso atual (kg)</label>
          <input type="number" step="0.1" id="pet-peso" class="field-input" required>
        </div>
        <div>
          <label class="field">Nascimento</label>
          <input type="text" id="pet-nascimento" class="field-input" placeholder="dd/mm/aaaa" maxlength="10" required>
        </div>
      </div>

      <div class="section-label">Castrado?</div>
      <div class="toggle-row" id="toggle-castrado">
        <div class="toggle-opt" data-value="nao">Não castrado</div>
        <div class="toggle-opt" data-value="sim">Castrado</div>
      </div>

      <div class="section-label">Seu pet tem convênio? <span class="opt">(opcional)</span></div>
      <div class="toggle-row" id="toggle-convenio">
        <div class="toggle-opt" data-value="nao">Não tenho</div>
        <div class="toggle-opt" data-value="sim">Sim, tenho</div>
      </div>
      <input type="text" id="pet-convenio-nome" class="field-input" placeholder="Qual convênio?" style="margin-top:8px;display:none">

      <button type="submit" class="cta-btn">Salvar alterações</button>
    </form>
  </div>

  <script type="module" src="js/editar-pet.js"></script>
</body>
</html>
