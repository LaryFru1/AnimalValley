<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Valley — Painel da recepção</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Login da equipe -->
  <div class="screen" id="tela-login">
    <div class="topbar">
      <div class="brand">Animal <span>Valley</span></div>
      <div class="sub">Acesso da equipe</div>
    </div>
    <form id="form-login-equipe" class="body">
      <label class="field">E-mail</label>
      <input type="email" id="eq-email" class="field-input" required>
      <label class="field">Senha</label>
      <input type="password" id="eq-senha" class="field-input" required>
      <div style="text-align:right;margin-bottom:8px">
  <button type="button" id="eq-esqueci" style="background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;padding:0">Esqueci minha senha</button>
</div>
      <button type="submit" class="cta-btn">Entrar</button>
    </form>
  </div>

  <!-- Painel (só aparece depois do login de alguém da equipe) -->
  <div class="painel" id="tela-painel" style="display:none">
    <div class="painel-topo">
      <div>
        <div class="painel-titulo">Painel da recepção — Animal Valley</div>
        <div class="painel-sub" id="painel-usuario"></div>
      </div>
      <button class="btn-sair-painel" id="btn-sair-painel">Sair</button>
    </div>

    <div class="painel-corpo">
  <div class="painel-secao">
    <div class="painel-secao-topo">
      <h3>Pré-agendamentos aguardando confirmação</h3>
      <button class="btn-atualizar" id="btn-atualizar">↻ Atualizar</button>
    </div>
    <div id="lista-pendentes"></div>
  </div>

  <div class="painel-secao">
    <div class="painel-secao-topo">
      <h3>Cadastros desativados (últimos 30 dias)</h3>
      <button class="btn-atualizar" id="btn-atualizar-desativados">↻ Atualizar</button>
    </div>
    <div id="lista-desativados"></div>
  </div>
  
    <div class="painel-secao">
      <h3>Documentos e exames dos pets</h3>
      <input type="text" id="busca-doc" class="field-input" placeholder="🔍 Buscar por nome do pet ou do tutor..." style="margin-bottom:10px">
      <div id="resultado-busca-doc"></div>
    </div>
</div>

  <script type="module" src="js/recepcao.js"></script>
</body>
</html>
