<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Valley — Painel da recepção</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Login da equipe -->
  <div class="screen" id="tela-login">
    <div class="topbar">
      <div class="brand">Animal <span>Valley</span></div>
      <div class="sub">Acesso da equipe</div>
    </div>
    <form id="form-login-equipe" class="body">
      <label class="field">E-mail</label>
      <input type="email" id="eq-email" class="field-input" required>
      <label class="field">Senha</label>
      <input type="password" id="eq-senha" class="field-input" required>
      <div style="text-align:right;margin-bottom:8px">
  <button type="button" id="eq-esqueci" style="background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;padding:0">Esqueci minha senha</button>
</div>
      <button type="submit" class="cta-btn">Entrar</button>
    </form>
  </div>

  <!-- Painel (só aparece depois do login de alguém da equipe) -->
  <div class="painel" id="tela-painel" style="display:none">
    <div class="painel-topo">
      <div>
        <div class="painel-titulo">Painel da recepção — Animal Valley</div>
        <div class="painel-sub" id="painel-usuario"></div>
      </div>
      <button class="btn-sair-painel" id="btn-sair-painel">Sair</button>
    </div>

    <div class="painel-corpo">
  <div class="painel-secao">
    <div class="painel-secao-topo">
      <h3>Pré-agendamentos aguardando confirmação</h3>
      <button class="btn-atualizar" id="btn-atualizar">↻ Atualizar</button>
    </div>
    <div id="lista-pendentes"></div>
    
    <div class="painel-secao">
      <div class="painel-secao-topo">
        <h3>Agenda</h3>
        <input type="date" id="agenda-data" class="field-input" style="max-width:160px">
        <button class="btn-atualizar" id="btn-atualizar-agenda-hoje">↻ Atualizar</button>
      </div>
      <div id="lista-agenda-hoje"></div>
    </div>
  </div>

  <div class="painel-secao">
    <div class="painel-secao-topo">
      <h3>Cadastros desativados (últimos 30 dias)</h3>
      <button class="btn-atualizar" id="btn-atualizar-desativados">↻ Atualizar</button>
    </div>
    <div id="lista-desativados"></div>
  </div>
  
    <div class="painel-secao">
      <h3>Documentos e exames dos pets</h3>
      <input type="text" id="busca-doc" class="field-input" placeholder="🔍 Buscar por nome do pet ou do tutor..." style="margin-bottom:10px">
      <div id="resultado-busca-doc"></div>
    </div>
    
    <div class="painel-secao" id="secao-bloqueios">
      <h3>Agenda — bloquear horário ou dia</h3>

      <label class="field">Profissional</label>
      <select id="bloq-profissional" class="field-input"></select>

      <label class="field">Data</label>
      <input type="text" id="bloq-data" class="field-input" placeholder="dd/mm/aaaa" maxlength="10">

      <div class="toggle-row" id="bloq-tipo">
        <div class="toggle-opt picked" data-value="dia">Dia inteiro</div>
        <div class="toggle-opt" data-value="horario">Só um horário</div>
      </div>

      <div id="bloq-horarios" style="display:none;margin-top:10px">
        <div class="field-row">
          <div><label class="field">Das</label><input type="time" id="bloq-inicio" class="field-input"></div>
          <div><label class="field">Até</label><input type="time" id="bloq-fim" class="field-input"></div>
        </div>
      </div>

      <label class="field">Motivo</label>
      <input type="text" id="bloq-motivo" class="field-input" placeholder="Ex: Folga, feriado, agendado por telefone">

      <div id="bloq-dados-cliente" style="display:none">
        <label class="field">Nome do responsável</label>
<input type="text" id="bloq-cliente" class="field-input" required>
        <label class="field">Nome do pet</label>
        <input type="text" id="bloq-pet" class="field-input" required>
        <label class="field">Serviço combinado</label>
        <input type="text" id="bloq-servico" class="field-input" placeholder="Ex: Banho P, Consulta..." required>
      </div>

      <button class="cta-btn" id="btn-criar-bloqueio" style="margin-top:12px">Bloquear</button>

      <div class="section-label">Bloqueios futuros</div>
      <div id="lista-bloqueios"></div>
    </div>
</div>

  <script type="module" src="js/recepcao.js"></script>
</body>
</html>
