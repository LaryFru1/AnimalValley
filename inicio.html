<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Valley — Início</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="brand">Animal <span>Valley</span></div>
      <div class="sub" id="saudacao">Olá! 👋</div>
    </div>

    <div class="body">
      <div class="hero-card">
        <h2>Cuide do seu pet em poucos toques</h2>
        <p>Escolha o pet, o serviço e o horário.</p>
        <button class="cta-btn" id="btn-agendar">Agendar um horário</button>
      </div>

      <div class="section-label">Seu pacote ativo</div>
      <div class="pkg-card">
  <div class="pkg-name">Banho e Tosa · 4 sessões</div>
  <div class="pkg-track">
    <div class="pkg-dot used"></div>
    <div class="pkg-dot used"></div>
    <div class="pkg-dot"></div>
    <div class="pkg-dot"></div>
  </div>
  <div class="pkg-meta" id="pkg-info">2 de 4 usados</div>
</div>

      <div class="section-label">Novidades</div>
      <div class="wa-card">
        <div>
          <div class="wa-name">Comunidade Animal Valley</div>
          <div class="wa-meta">Avisos e novidades no WhatsApp</div>
        </div>
        <button class="wa-mini" id="btn-comunidade">Entrar</button>
      </div>
    </div>

    <div class="nav-tabs">
      <div class="nt active">🏠 Início</div>
      <div class="nt" id="nav-pets">🐾 Pets</div>
      <div class="nt" id="nav-conta">👤 Conta</div>
    </div>
  </div>

  <script src="js/inicio.js"></script>
</body>
</html>
