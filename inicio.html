<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Valley — Início</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="brand">Animal <span>Valley</span></div>
      <div class="sub" id="saudacao"></div>
    </div>

    <div class="body">
      <div class="hero-card">
        <h2>Cuide do seu pet em poucos toques</h2>
        <p>Escolha o pet, o serviço e o horário.</p>
        <button class="cta-btn" id="btn-agendar">Agendar um horário</button>
      </div>

      <div class="section-label">Seu pacote ativo</div>
      <div id="area-pacote"></div>

      <div class="section-label">Documentos e exames</div>
      <div class="doc-card">
        <div id="lista-docs"></div>
        <select id="doc-pet-select" class="field-input" style="margin-bottom:8px"></select>
<input type="file" id="doc-arquivo" accept=".pdf,image/*" style="display:none">
<button class="ghost-btn" id="btn-anexar">＋ Anexar documento</button>
      </div>

      <div class="section-label">Novidades</div>
      <div class="wa-card">
        <div>
          <div class="name">Comunidade Animal Valley</div>
          <div class="meta">Avisos e novidades no WhatsApp</div>
        </div>
        <button class="wa-mini" id="btn-comunidade">Entrar</button>
      </div>
    </div>

    <div class="nav-tabs">
      <div class="nt active">🏠 Início</div>
      <div class="nt" id="nav-pets">🐾 Pets</div>
      <div class="nt" id="nav-conta">👤 Conta</div>
    </div>
  </div>

  <script type="module" src="js/inicio.js"></script>
</body>
</html>
