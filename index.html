<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Valley</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="brand">Animal <span>Valley</span></div>
      <div class="sub">Entrar ou criar conta</div>
    </div>

    <form id="login-form" class="body">
      <label class="field">E-mail</label>
      <input type="email" id="login-user" class="field-input" placeholder="seuemail@exemplo.com">

      <label class="field">Senha</label>
      <div style="position:relative">
  <input type="password" id="login-pass" class="field-input" placeholder="••••••••" style="padding-right:40px">
  <button type="button" id="olho-login" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px">👁️</button>
</div>

     <div style="text-align:right;margin-top:8px">
  <button type="button" id="btn-esqueci" style="background:none;border:none;color:var(--ink-soft);font-size:11.5px;cursor:pointer;padding:0">Esqueci minha senha</button>
</div>
<button type="submit" class="cta-btn">Entrar</button>
    <div class="divider">ou</div>
    <button class="ghost-btn" id="go-signup">Criar minha conta</button>
  </div>

  <script type="module" src="js/script.js"></script>
</body>
</html>
