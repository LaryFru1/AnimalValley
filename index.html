<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Valley</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="brand">Animal <span>Valley</span></div>
      <div class="sub">Entrar ou criar conta</div>
    </div>

    <form id="login-form" class="body">
      <label class="field">Telefone ou e-mail</label>
      <input type="text" id="login-user" class="field-input" placeholder="(11) 90000-0000">

      <label class="field">Senha</label>
      <input type="password" id="login-pass" class="field-input" placeholder="••••••••">

      <button type="submit" class="cta-btn">Entrar</button>
    </form>

    <div class="divider">ou</div>
    <button class="ghost-btn" id="go-signup">Criar minha conta</button>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
