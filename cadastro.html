<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Valley — Criar conta</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="brand">Animal <span>Valley</span></div>
      <div class="sub">Criar conta</div>
    </div>

    <form id="signup-form" class="body">
      <label class="field">Seu nome</label>
      <input type="text" id="su-nome" class="field-input" placeholder="Ex: Ana Souza" required>

      <label class="field">Telefone / WhatsApp</label>
      <input type="tel" id="su-telefone" class="field-input" placeholder="(11) 90000-0000" required>

      <label class="field">Senha</label>
      <input type="password" id="su-senha" class="field-input" placeholder="••••••••" required>

      <div class="section-label">Seu pet</div>

      <label class="field">Nome do pet</label>
      <input type="text" id="pet-nome" class="field-input" placeholder="Ex: Thor" required>

      <label class="field">Espécie</label>
      <select id="pet-especie" class="field-input" required>
        <option value="">Selecione</option>
        <option value="cao">Cão</option>
        <option value="gato">Gato</option>
        <option value="outro">Outro</option>
      </select>

      <label class="field">Raça</label>
      <input type="text" id="pet-raca" class="field-input" placeholder="Ex: Vira-lata, Poodle...">

      <label class="field">Peso atual (kg)</label>
      <input type="number" step="0.1" id="pet-peso" class="field-input" placeholder="Ex: 4.2" required>

      <button type="submit" class="cta-btn">Criar conta e continuar</button>
    </form>
  </div>

  <script src="js/cadastro.js"></script>
</body>
</html>
