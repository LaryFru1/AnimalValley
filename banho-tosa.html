<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Valley — Banho e Tosa</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="screen">
    <div class="back-row">
      <button class="back-btn" id="btn-voltar">←</button>
      <div>
        <div class="step-title" id="titulo">Banho e tosa</div>
        <div class="step-hint">Passo 3 de 5</div>
      </div>
    </div>

    <div class="body">
      <div class="toggle-row" id="toggle-forma">
        <div class="toggle-opt picked" data-value="avulso">Avulso</div>
        <div class="toggle-opt" data-value="pacote">Usar pacote</div>
      </div>

      <div id="banner-pacote" style="display:none"></div>

      <div id="lista-itens" style="margin-top:12px"></div>
    </div>

    <div class="bottom-bar">
      <div class="total-row"><span id="total-label">Total selecionado</span><span id="total">R$ 0</span></div>
      <button class="next-btn" id="btn-continuar">Continuar</button>
    </div>
  </div>

  <script type="module" src="js/banho-tosa.js"></script>
</body>
</html>
